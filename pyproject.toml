[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devkit"
version = "0.1.0"
description = "A small multi-tool CLI: git snapshot, env check, dead code detection, log watch, and GitHub portfolio blurbs."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
devkit = "devkit.cli:cli"

[tool.setuptools]
packages = ["devkit"]
